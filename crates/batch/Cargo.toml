[package]
name = "rustfs-batch"
version.workspace = true
edition.workspace = true
authors = ["RustFS Team"]
license.workspace = true
description = "RustFS batch job framework (replicate job type)"
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustfs-batch/latest/rustfs_batch/"
keywords = ["RustFS", "batch", "replication", "s3", "Minio"]
categories = ["web-programming", "development-tools", "filesystem"]

[lints]
workspace = true

[dependencies]
rustfs-ecstore = { workspace = true }
rustfs-madmin = { workspace = true }
rustfs-common = { workspace = true }

aws-sdk-s3 = { workspace = true }

http = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "fast-rng"] }
chrono = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
aws-smithy-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt", "macros"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
