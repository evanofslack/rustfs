[package]
name = "rustfs-tables"
version.workspace = true
edition.workspace = true
authors = ["RustFS Team"]
license.workspace = true
description = "RustFS S3 Tables — Iceberg REST Catalog implementation compatible with MinIO AIStor Tables and AWS S3 Tables"
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustfs-tables/latest/rustfs_tables/"
keywords = ["RustFS", "iceberg", "tables", "s3", "catalog"]
categories = ["web-programming", "development-tools", "filesystem"]

[lints]
workspace = true

[dependencies]
rustfs-ecstore = { workspace = true }
rustfs-policy = { workspace = true }
rustfs-iam = { workspace = true }
rustfs-config = { workspace = true }

# Iceberg types (no storage-* features — we use rustfs-ecstore for I/O)
iceberg = { version = "0.8", default-features = false }

# HTTP / async
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Utilities
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "fast-rng"] }
matchit = { workspace = true }
chrono = { workspace = true }

# Shared s3s types for handler integration
s3s = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt", "macros"] }
serde_json = { workspace = true }
